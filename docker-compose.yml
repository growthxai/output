name: output-dev

services:
  redis:
    image: redis:8-alpine
    networks:
      - main
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s

  postgresql:
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:17.5
    networks:
      - main
    expose:
      - 5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s

  temporal:
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DEFAULT_NAMESPACE_RETENTION=720h
    image: temporalio/auto-setup:latest
    # auto-setup has no env var for custom search attributes; `create` is idempotent for an unchanged name/type.
    entrypoint:
      - sh
      - -c
      - |
        (until temporal operator search-attribute create --address temporal:7233 --namespace default --name WorkspaceId --type Keyword; do sleep 1; done) &
        exec /etc/temporal/entrypoint.sh autosetup
    networks:
      - main
    ports:
      - '7233:7233'
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'tctl --address temporal:7233 cluster health 2>&1 | grep -q "temporal.api.workflowservice.v1.WorkflowService: SERVING" && temporal operator search-attribute list --address temporal:7233 --namespace default | grep -q WorkspaceId'
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal-ui:
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:latest
    networks:
      - main
    ports:
      - '8080:8080'

  api:
    init: true
    depends_on:
      temporal:
        condition: service_healthy
      worker:
        condition: service_healthy
    image: node:24.15.0-slim
    networks:
      - main
    environment:
      - OUTPUT_API_PORT=3001
      - OUTPUT_CATALOG_ID=main
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_API_KEY=${TEMPORAL_API_KEY:-}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    command: node /app/api/src/index.js
    ports:
      - '3001:3001'
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules

  worker:
    init: true
    depends_on:
      temporal:
        condition: service_healthy
    image: node:24.15.0 # Use full image to include ca certificates and allow for remote temporal connection
    healthcheck:
      test: [ 'CMD-SHELL', 'cd ./test_workflows && npx output-healthcheck' ]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - main
    env_file: './test_workflows/.env'
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - TEST_API_URL=http://api:3001
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_API_KEY=${TEMPORAL_API_KEY:-}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - OUTPUT_CATALOG_ID=main
      - OUTPUT_REDIS_URL=redis://redis:6379
      - OUTPUT_TRACE_LOCAL_ON=true
      - OUTPUT_TRACE_HOST_PATH=${PWD}/test_workflows/logs
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && npm run build:packages && cd ./test_workflows && npm run output:worker:watch"
    working_dir: /app
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules

volumes:
  worker_node_modules:
  postgres:
  redis:

networks:
  main:
