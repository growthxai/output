# Refreshes the bundled models.dev pricing snapshot and opens a PR with the result.
name: Take models pricing snapshot

on:
  schedule:
    - cron: '0 6 * * 1' # once a week, Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  snapshot:
    name: Take models pricing snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Take snapshot
        run: npm run --prefix sdk/llm take-models-pricing-snapshot

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_GH_TOKEN }}
          branch: chore/take-models-pricing-snapshot
          title: 'chore(llm): update models pricing snapshot'
          commit-message: 'chore(llm): update models pricing snapshot'
