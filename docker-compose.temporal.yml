name: output-sdk
services:
  redis:
    image: redis:8-alpine
    networks:
      - main
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s

  postgresql:
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:17.5
    networks:
      - main
    expose:
      - 5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s

  temporal:
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DEFAULT_NAMESPACE_RETENTION=720h
    image: temporalio/auto-setup:latest
    # auto-setup has no env var for custom search attributes; `create` is idempotent for an unchanged name/type.
    entrypoint:
      - sh
      - -c
      - |
        (until temporal operator search-attribute create --address temporal:7233 --namespace default --name WorkspaceId --type Keyword; do sleep 1; done) &
        exec /etc/temporal/entrypoint.sh autosetup
    networks:
      - main
    ports:
      - '7233:7233'
    healthcheck:
      test: ['CMD-SHELL', 'temporal operator search-attribute list --address temporal:7233 --namespace default | grep -q WorkspaceId']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal-ui:
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:latest
    networks:
      - main
    ports:
      - '8080:8080'

volumes:
  postgres:
  redis:

networks:
  main:
    name: main
    driver: bridge
